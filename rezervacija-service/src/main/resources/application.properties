spring.application.name=rezervacija-service
server.port=8082

spring.config.import=optional:configserver:http://localhost:8888/

spring.datasource.url=jdbc:mysql://localhost:3306/projekat
spring.datasource.username=username
spring.datasource.password=password
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.hikari.maximum-pool-size=2

resilience4j.retry.instances.postojiKorisnik.max-attempts=5
resilience4j.retry.instances.postojiKorisnik.wait-duration=120s
resilience4j.retry.instances.postojiKorisnik.enable-exponential-backoff=true

#eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka

# dodati ukoliko API Gateway ne radi i bacen je UnknownHostException
# (dodaje se u sve obicne mikroservise)
eureka.instance.hostname=localhost
