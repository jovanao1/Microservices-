spring.application.name=racun-service
server.port=8081

spring.config.import=optional:configserver:http://localhost:8888/

spring.datasource.url=jdbc:mysql://localhost:3306/projekat
spring.datasource.username=username
spring.datasource.password=password
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.hikari.maximum-pool-size=2

resilience4j.ratelimiter.instances.dodajRacun.limit-for-period=4
resilience4j.ratelimiter.instances.dodajRacun.limit-refresh-period=10s

resilience4j.retry.instances.postojiKonobar.max-attempts=3
resilience4j.retry.instances.postojiKonobar.enable-exponential-backoff=true
resilience4j.retry.instances.postojiKonobar.wait-duration=30s

#eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka

# dodati ukoliko API Gateway ne radi i bacen je UnknownHostException
# (dodaje se u sve obicne mikroservise)
eureka.instance.hostname=localhost
