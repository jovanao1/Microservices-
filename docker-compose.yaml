services:
  eureka-service:
    image: xyz/eureka-service:0.1
    mem_limit: 700m
    ports:
      - "8761:8761"
    networks:
      - projekat-network

  rezervacija-service:
    image: xyz/rezervacija-service:0.1
    #mem_limit: 700m
    ports:
      - "8082:8082"
    depends_on:
      - eureka-service
      - racun-service
    networks:
      - projekat-network
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka
      - spring.datasource.url=jdbc:mysql://host.docker.internal:3306/projekat
      #spring.datasource.username=username
      #spring.datasource.password=password

  racun-service:
    image: xyz/racun-service:0.1
    #mem_limit: 700m
    ports:
      - "8081:8081"
    depends_on:
      - eureka-service
    networks:
      - projekat-network
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka
      - spring.datasource.url=jdbc:mysql://host.docker.internal:3306/projekat
      #spring.datasource.username=username
      #spring.datasource.password=password

  meni-service:
    image: xyz/meni-service:0.1
    #mem_limit: 700m
    ports:
      - "8080:8080"
    depends_on:
      - eureka-service
      - racun-service
    networks:
      - projekat-network
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka
      - spring.datasource.url=jdbc:mysql://host.docker.internal:3306/projekat
      #spring.datasource.username=username
      #spring.datasource.password=password

  api-gateway:
    image: xyz/apigateway-service:0.1
    #mem_limit: 700m
    ports:
      - "8765:8765"
    depends_on:
      - eureka-service
      - racun-service
      - meni-service
      - rezervacija-service
    networks:
      - projekat-network
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka

networks:

  projekat-network:
